<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .tiptap-image-long {
        width: 168px;
        height: 299px;
        object-fit: cover;
        object-position: top;
        position: relative;
    }
    .tiptap-image-long::after {
            content: '长图';
            position: absolute;
            bottom: 8px;
            right: 8px;
            z-index: 2;
            height: 20px;
            padding: 0 6px;
            border-radius: 20px;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-size: 12px;
            line-height: 20px;
        }
  </style>
</head>
<body>
  <img class="tiptap-image-long" src="./longPic.jpg" />
</body>
</html>
